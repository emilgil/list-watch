[project]
name = "listwatch"
version = "0.1.0"
description = "Amazon.se wishlist price watcher"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "apprise>=1.9",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
listwatch = "listwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
listwatch = ["migrations/*.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
